:root {
  --cream: #fbf4e8;

  --brown: #5a3e2b;
  --dark: #3b2819;

  --shadow-md: 0 12px 30px rgba(90, 62, 43, 0.16);

  --font-body: "Poppins", system-ui, sans-serif;

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; scroll-padding-top: 80px; }

body {

  overflow-x: hidden;
}

body::before {
  content: "";

}
.nav__links a:hover,
